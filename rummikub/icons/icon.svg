<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="Rummikub">
  <defs><clipPath id="r"><rect width="512" height="512" rx="104"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#2a3644"/>
    <rect x="40" y="40" width="432" height="432" rx="80" fill="#22303c"/>
    <!-- A group: four "7" tiles, one in each Rummikub colour, fanned like a held
         hand (rotated about a pivot below the board). -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800"
       text-anchor="middle" dominant-baseline="central">
      <g transform="rotate(-22 256 560)">
        <rect x="206" y="146" width="100" height="176" rx="16" fill="#f5edd9" stroke="#cbb98f" stroke-width="3"/>
        <rect x="206" y="300" width="100" height="22" rx="8" fill="#e4d7b3"/>
        <text x="256" y="228" font-size="92" fill="#d1453b">7</text>
      </g>
      <g transform="rotate(-7.4 256 560)">
        <rect x="206" y="146" width="100" height="176" rx="16" fill="#f5edd9" stroke="#cbb98f" stroke-width="3"/>
        <rect x="206" y="300" width="100" height="22" rx="8" fill="#e4d7b3"/>
        <text x="256" y="228" font-size="92" fill="#e08a2c">7</text>
      </g>
      <g transform="rotate(7.4 256 560)">
        <rect x="206" y="146" width="100" height="176" rx="16" fill="#f5edd9" stroke="#cbb98f" stroke-width="3"/>
        <rect x="206" y="300" width="100" height="22" rx="8" fill="#e4d7b3"/>
        <text x="256" y="228" font-size="92" fill="#2f6bc4">7</text>
      </g>
      <g transform="rotate(22 256 560)">
        <rect x="206" y="146" width="100" height="176" rx="16" fill="#f5edd9" stroke="#cbb98f" stroke-width="3"/>
        <rect x="206" y="300" width="100" height="22" rx="8" fill="#e4d7b3"/>
        <text x="256" y="228" font-size="92" fill="#2b3440">7</text>
      </g>
    </g>
  </g>
</svg>
