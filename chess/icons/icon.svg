<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="Chess">
  <defs><clipPath id="r"><rect width="512" height="512" rx="104"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#3a4a5c"/>
    <g fill="#d6cdba">
      <rect x="0" y="0" width="128" height="128"/>
      <rect x="256" y="0" width="128" height="128"/>
      <rect x="128" y="128" width="128" height="128"/>
      <rect x="384" y="128" width="128" height="128"/>
      <rect x="0" y="256" width="128" height="128"/>
      <rect x="256" y="256" width="128" height="128"/>
      <rect x="128" y="384" width="128" height="128"/>
      <rect x="384" y="384" width="128" height="128"/>
    </g>
    <!-- pawn: dark silhouette (outline) then white fill; each layer is one colour
         and its parts overlap vertically, so there are no seams or gaps -->
    <g fill="#16202c">
      <circle cx="256" cy="164" r="73"/>
      <ellipse cx="256" cy="226" rx="86" ry="30"/>
      <polygon points="200,232 312,232 368,432 144,432"/>
      <rect x="134" y="412" width="244" height="42" rx="12"/>
    </g>
    <g fill="#f4f6f8">
      <circle cx="256" cy="164" r="58"/>
      <ellipse cx="256" cy="226" rx="70" ry="22"/>
      <polygon points="216,238 296,238 352,428 160,428"/>
      <rect x="150" y="418" width="212" height="30" rx="9"/>
    </g>
  </g>
</svg>
